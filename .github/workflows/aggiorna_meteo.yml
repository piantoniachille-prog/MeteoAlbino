name: Aggiornamento Stazione Meteo

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - 'bollettino.py'
      - '.github/workflows/aggiorna_meteo.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: meteo-pubblicazione
  cancel-in-progress: false

jobs:
  update-weather-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recupera i dati Ecowitt
        env:
          ECOWITT_APPLICATION_KEY: ${{ secrets.ECOWITT_APPLICATION_KEY }}
          ECOWITT_API_KEY: ${{ secrets.ECOWITT_API_KEY }}
          ECOWITT_MAC: ${{ secrets.ECOWITT_MAC }}
        run: python bollettino.py
      - name: Conserva le osservazioni nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ultimo_stato.json storico_albanello.jsonl
          if ! git diff --staged --quiet; then
            git commit -m "Aggiorna osservazioni meteo [skip ci]"
            git push
          fi
      - name: Prepara solo i file pubblici
        run: |
          mkdir -p _site
          cp index.html styles.css app.js ultimo_stato.json storico_albanello.jsonl _site/
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepara la pubblicazione
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Pubblica il sito
        id: deployment
        uses: actions/deploy-pages@v4
